<style>
body{margin:0;background:#F7F4EF}
a{color:#1B1A18}a:hover{color:#A4582C}
.mv-nav a{text-decoration:none}
.mv-nav a:hover{text-decoration:underline;text-underline-offset:4px}
.mv-tile img{transition:transform .9s cubic-bezier(.2,.7,.2,1)}
.mv-tile:hover img{transform:scale(1.03)}
.mv-chip{cursor:pointer;transition:background .2s,color .2s}
@keyframes mvIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.mv-cell{animation:mvIn .6s ease both}
@media (max-width: 760px){.mv-cell{grid-column:span 12 !important;margin-top:0 !important}}
@media (prefers-reduced-motion: reduce){.mv-cell{animation:none}}
.mv-dd{position:relative}.mv-ddm{display:none;position:absolute;top:100%;left:-18px;padding-top:12px;z-index:60}.mv-dd:hover .mv-ddm,.mv-dd:focus-within .mv-ddm{display:block}.mv-ddm a{display:block;padding:10px 18px;white-space:nowrap}.mv-ddm a:hover{background:#EFEAE2;text-decoration:none !important}
@keyframes mvReveal{from{opacity:0;transform:translateY(48px)}to{opacity:1;transform:none}}@supports (animation-timeline: view()){.mv-tile,figure{animation:mvReveal linear both;animation-timeline:view();animation-range:entry 0% cover 28%}}@media (prefers-reduced-motion: reduce){.mv-tile,figure{animation:none !important}}
@keyframes mvFloat{from{translate:0 0}to{translate:0 -10px}}.mv-tile > span:first-child,figure > img{animation:mvFloat 7s ease-in-out infinite alternate}.mv-tile:nth-child(3n+2) > span:first-child,figure:nth-child(3n+2) > img{animation-duration:9s;animation-delay:-3s}.mv-tile:nth-child(3n) > span:first-child,figure:nth-child(3n) > img{animation-duration:8s;animation-delay:-5s}@media (prefers-reduced-motion: reduce){.mv-tile > span:first-child,figure > img{animation:none !important}}
</style>
<style>
html{-webkit-text-size-adjust:100%}
img{max-width:100%}
h1,h2,h3,p,a,span{overflow-wrap:break-word}
a[href^="mailto"]{overflow-wrap:anywhere}
@media (max-width: 760px){
  body [style*="padding: 28px 40px"]{padding:20px 20px !important}
  body [style*="40px"][style*="padding"]{padding-left:20px !important;padding-right:20px !important}
  body [style*="gap: 32px 64px"],body [style*="gap: 40px 64px"],body [style*="gap: 16px 80px"]{column-gap:24px !important}
  [style*="repeat(12"]{grid-template-columns:minmax(0,1fr) !important;column-gap:0 !important}
  [style*="repeat(12"] > *{grid-column:auto !important;margin-top:0 !important}
  .mv-nav{gap:8px 18px !important}
  .mv-ddm{left:auto !important;right:auto}
}
</style>

<body>
<template id="dc-tpl">
<div style="min-height: 100vh; background: #F7F4EF; color: #1B1A18; font-family: 'Instrument Sans', system-ui, sans-serif; font-size: 17px; line-height: 1.5">

<header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px 32px; padding: 28px 40px">
<a href="index.html" style="font-size: 26px; font-weight: 600; letter-spacing: -0.02em; text-decoration: none">Maver<span style="color: #A4582C">Ink</span></a>
<nav class="mv-nav" aria-label="Main" style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 28px; font-size: 15px">
<a href="work.html" aria-current="page" style="color: #A4582C">Work</a>
<div class="mv-dd"><button type="button" aria-haspopup="true" style="font: inherit; background: none; border: 0; padding: 0; cursor: pointer; color: inherit">Illustration &amp; SciArt <span aria-hidden="true" style="font-size: 11px">▾</span></button><div class="mv-ddm"><div style="background: #F7F4EF; border: 1px solid #DDD6CB; padding: 8px 0; box-shadow: 0 12px 32px rgba(27,26,24,.10)"><a href="science-illustration.html">Science Illustration</a><a href="scitype.html">#SciType</a><a href="elemental.html">Elemental</a><a href="sciart-collab.html">Art-Science Co-Lab</a></div></div></div>
<a href="talks-writing.html">Talks &amp; Writing</a>
<a href="about.html">About</a>
<a href="index.html#contact" style="padding: 10px 20px; border: 1px solid #1B1A18; border-radius: 999px; text-decoration: none">Contact</a>
</nav>
</header>

<main style="max-width: 1440px; margin: 0 auto; padding: 56px 40px 120px; box-sizing: border-box; display: flex; flex-direction: column; gap: 48px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 24px">
<h1 style="margin: 0; font-size: clamp(44px, 6vw, 88px); line-height: 1; font-weight: 500; letter-spacing: -0.035em">Work</h1>
<p style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #5F5A52">{{count}}</p>
</div>

<div role="group" aria-label="Filter by medium" style="display: flex; flex-wrap: wrap; gap: 10px; padding-bottom: 8px; border-bottom: 1px solid #DDD6CB">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="7">
<button type="button" class="mv-chip" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="{{c.style}}">{{c.label}}</button>
</sc-for>
</div>

<div style="display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 64px 40px; align-items: start">
<sc-for list="{{items}}" as="p" hint-placeholder-count="10">
<a href="{{p.href}}" class="mv-tile mv-cell" style="grid-column: span {{p.span}}; margin-top: {{p.mt}}px; display: flex; flex-direction: column; gap: 14px; text-decoration: none">
<span style="position: relative; display: block; overflow: hidden; aspect-ratio: {{p.ratio}}; background: #E8E2D8">
<sc-if value="{{p.hasImg}}" hint-placeholder-val="{{ true }}">
<img src="{{p.src}}" alt="{{p.alt}}" style="width: 100%; height: 100%; object-fit: cover; display: block">
</sc-if>
<sc-if value="{{p.noImg}}" hint-placeholder-val="{{ false }}">
<span style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #8A8378">[Image: {{p.title}}]</span>
</sc-if>
<sc-if value="{{p.hasBadge}}" hint-placeholder-val="{{ false }}">
<span style="position: absolute; top: 14px; left: 14px; padding: 5px 12px; border-radius: 999px; background: #F7F4EF; color: #A4582C; font-size: 12px; font-weight: 600; letter-spacing: 0.02em">{{p.badge}}</span>
</sc-if>
</span>
<span style="display: flex; justify-content: space-between; align-items: baseline; gap: 16px">
<span style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
<span style="font-size: 22px; font-weight: 500; letter-spacing: -0.01em">{{p.title}}</span>
<span style="font-size: 15px; color: #5F5A52">{{p.where}}</span>
</span>
<span style="flex: none; text-align: right; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #1E5E5A">{{p.medium}}<br><span style="color: #5F5A52">{{p.year}}</span></span>
</span>
</a>
</sc-for>
</div>
</main>

<footer style="border-top: 1px solid #DDD6CB">
<div class="mv-nav" style="max-width: 1440px; margin: 0 auto; padding: 40px; box-sizing: border-box; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; font-size: 14px; color: #5F5A52">
<span>© 2026 Madhushree Kamak · MaverInk</span>
<a href="mailto:madhushree.kamak@gmail.com">madhushree.kamak@gmail.com</a>
</div>
</footer>

</div>
</template>
<div id="dc-root"></div>
<script type="text/plain" id="dc-logic">
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { f: 'All' }; }
  renderVals() {
    var self = this;
    var B = {
      rice: 'img/11d9a33943506aace2d7919df871a633.jpg',
      tate: 'img/6c17269d54a92d2cb59a059e503ad81f.jpg',
      carbon: 'img/17079b3231fdb0c460fdef526348747a.jpg',
      psyche: 'img/acc2c7896cd0d5af94c88295f76bcf5f.jpg',
      sub: 'img/a62a899a1563d34463c0309978efffd6.jpg'
    };
    var all = [
      { title: 'Chasing Rice', where: 'Tokyo Arts and Space (TOKAS), Tokyo', medium: 'Residency', year: '2026', badge: 'Ongoing', src: B.rice, ratio: '3 / 2', alt: 'Rice varieties at the TOKAS Open Studio', href: 'chasing-rice.html' },
      { title: 'Beneath the Green Canopy', where: 'Rani Abbakka Tulu Nadu Museum, Bantwal', medium: 'Exhibition', year: '2025–26', badge: 'New', ratio: '3 / 4', src: 'img/66f51dda231626d2234c01d07509614e.jpg', alt: 'Visitors among the terracotta-brick plinths at Beneath the Green Canopy', href: 'green-canopy.html' },
      { title: 'Hacking the Museum', where: 'Tate & Delfina Foundation, London', medium: 'Museum', tags: ['Museum','Residency'], year: '2024', badge: '', src: 'img/98c3bdfb624658f7940de8b4aa86b424.jpg', ratio: '4 / 3', alt: 'Co-creation workshop with Tate Collective Producers', href: 'hacking-the-museum.html' },
      { title: 'BreAIk, ChAInge, RegenerAIte', where: 'Goethe-Institut × MAP, Bengaluru', medium: 'Residency', year: '2025–26', badge: 'Ongoing', ratio: '16 / 10', src: 'img/d55c9f7f0455be6699fad49504b3e09c.jpg', alt: 'A BreAIk, ChAInge, RegenerAIte session', href: 'breaik.html' },
      { title: 'Being a Companion', where: 'Youth-LEARN Fellowship, Sangath, Bengaluru', medium: 'Programme', year: '2026', badge: 'New', ratio: '4 / 5', src: 'img/eb1582845d65028e6faf602b409dda9d.jpg', alt: 'Role cards sorted on a table during the workshop', href: 'programmes.html' },
      { title: 'Microbial Realm: Resistance Rising', where: 'Global Strategy Lab × Wellcome Trust', medium: 'Game', year: '2024–26', badge: 'Ongoing', ratio: '4 / 3', src: 'img/8f6e9e61f6411246b2436b559629668f.jpg', alt: 'Illustration of players around a Microbial Realm tabletop game', href: 'microbial-realm.html' },
      { title: 'Elemental: Battle of the Ions', where: 'Playing-card game on the periodic table', medium: 'Game', year: '2019', badge: '', ratio: '1 / 1', src: 'img/6441c3d0f904e87df23220ca2d211a75.jpg', alt: 'Elemental key visual', href: 'elemental.html' },
      { title: 'CARBON', where: 'Science Gallery Bengaluru', medium: 'Exhibition', year: '2023–24', badge: '', src: B.carbon, ratio: '16 / 10', alt: 'Installation view of CARBON', href: 'carbon.html' },
      { title: 'Manotsava', where: 'National Mental Health Festival', medium: 'Festival', year: '2024–26', badge: 'Ongoing', ratio: '1 / 1', src: 'img/c0c3a316d5b31df8b94a5383a8862ff0.jpg', alt: 'Crowds among the stalls at Manotsava 2025', href: 'manotsava.html' },
      { title: 'Good To Go', where: 'Death Literacy Festival · Pallium India × Vidhi', medium: 'Festival', year: '2025', badge: '', ratio: '4 / 5', src: 'img/0c16b5e1bcf30f4775137ff93ed2deeb.jpg', alt: 'Good To Go identity: gold kintsugi seams on black', href: 'good-to-go.html' },
      { title: 'PSYCHE', where: 'Science Gallery Bengaluru · Wellbeing Summit, Bilbao', medium: 'Exhibition', year: '2022', badge: '', src: B.psyche, ratio: '4 / 3', alt: 'Synthetic Self by Stelarc at PSYCHE', href: 'psyche.html' },
      { title: 'Museum of Innovation, Start-Ups and Technology', where: 'Bengaluru', medium: 'Museum', year: '2026', badge: 'Ongoing', ratio: '3 / 2', src: 'img/1e906f2fdad132e2b01d9b903ec78a5f.jpg', alt: 'Architectural render of the MIST entrance landscape', href: 'mist.html' },
      { title: 'SUBMERGE', where: 'Science Gallery Bengaluru', medium: 'Exhibition', year: '2019–20', badge: '', src: B.sub, ratio: '3 / 4', alt: 'Archaebot by Anna Dumitriu at SUBMERGE', href: 'submerge.html' },
      { title: 'CONTAGION', where: 'Science Gallery Bengaluru · online', medium: 'Exhibition', year: '2021', badge: '', ratio: '4 / 3', href: 'contagion.html', src: 'img/a4f200f92d7f2bfd66bdbbbb720ce680.jpg', alt: 'CONTAGION key visual' },
      { title: 'PHYTOPIA', where: 'Science Gallery Bengaluru · online', medium: 'Exhibition', year: '2020', badge: '', ratio: '1 / 1', href: 'phytopia.html', src: 'img/5c4c4dec4fe798755d63263ce1915b0d.jpg', alt: 'PHYTOPIA key visual' },
      { title: 'ELEMENTS', where: 'Science Gallery Bengaluru', medium: 'Exhibition', year: '2019', badge: '', ratio: '4 / 3', href: 'elements.html', src: 'img/f0208f0bef9461596d45c09395bc1752.jpg', alt: 'ELEMENTS key visual' },
      { title: 'Studio Quantum', where: 'Goethe-Institut × Science Gallery Bengaluru', medium: 'Programme', year: '2023', badge: '', ratio: '16 / 10', href: 'programmes.html', src: 'img/16c0dfb10fd83f391633661568d0aa5b.jpg', alt: 'Studio Quantum key visual' },
      { title: 'Xperimenter Programme', where: 'Science Gallery Bengaluru', medium: 'Programme', year: '2023', badge: '', ratio: '4 / 3', href: 'programmes.html', src: 'img/7f3980641b1a717fb77abe951f8306d0.jpg', alt: 'Xperimenter Programme key visual' },
      { title: 'Summer School on Carbon', where: 'IIHS · GCRF', medium: 'Programme', year: '2022', badge: '', ratio: '4 / 3', href: 'programmes.html', src: 'img/d21d87923defa0c89c9b96d3e717db3d.jpg', alt: 'Summer School on Carbon key visual' },
      { title: 'Re:Collect India', where: 'Oral history archive · Science Gallery Bengaluru', medium: 'Programme', year: '2021', badge: '', ratio: '4 / 3', href: 'programmes.html', src: 'img/8971b57fa699c142724b5dc66498a4eb.jpg', alt: 'Re:Collect India key visual' }
    ];
    var spans = [7, 5, 5, 7, 4, 4, 4, 6, 6, 8, 4, 5, 7];
    var mts = [0, 120, 0, 60, 0, 80, 20, 0, 100, 0, 140, 40, 0];
    var f = this.state.f;
    var list = all.filter(function (p) { return f === 'All' || p.medium === f || (p.tags && p.tags.indexOf(f) >= 0); });
    var items = list.map(function (p, i) {
      return Object.assign({}, p, {
        span: f === 'All' ? spans[i % spans.length] : (i % 3 === 0 ? 7 : (i % 3 === 1 ? 5 : 6)),
        mt: f === 'All' ? mts[i % mts.length] : 0,
        hasImg: !!p.src, noImg: !p.src, hasBadge: !!p.badge,
        href: p.href || '#', alt: p.alt || ''
      });
    });
    var labels = ['All', 'Exhibition', 'Museum', 'Residency', 'Festival', 'Game', 'Programme'];
    var chips = labels.map(function (l) {
      var on = l === f;
      return {
        label: l, pressed: on ? 'true' : 'false',
        style: on
          ? 'font: inherit; font-size: 14px; padding: 10px 18px; min-height: 44px; border-radius: 999px; border: 1px solid #1E5E5A; background: #1E5E5A; color: #F7F4EF'
          : 'font: inherit; font-size: 14px; padding: 10px 18px; min-height: 44px; border-radius: 999px; border: 1px solid #CFC7BA; background: transparent; color: #1B1A18',
        pick: function () { self.setState({ f: l }); }
      };
    });
    return { items: items, chips: chips, count: items.length + ' projects' };
  }
}
</script>
