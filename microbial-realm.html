<article>
<section style="max-width: 1440px; margin: 0 auto; padding: 40px 40px 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">
<a href="work.html" style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #5F5A52; text-decoration: none">← All work</a>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 14px">
<span style="padding: 5px 12px; border-radius: 999px; background: #F3E4D9; color: #8A4721; font-size: 12px; font-weight: 600; letter-spacing: 0.02em">Ongoing</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #1E5E5A">Game · Science communication · AMR</span>
</div>
<h1 style="margin: 0; font-size: clamp(48px, 8vw, 128px); line-height: 0.95; font-weight: 500; letter-spacing: -0.04em">Microbial Realm</h1>
<p style="margin: 0; font-size: clamp(22px, 2.6vw, 36px); line-height: 1.2; letter-spacing: -0.015em; color: #3D3A35">The Resistance Rising — a role-playing game about antimicrobial resistance, for teenagers.</p>
</section>

<section style="max-width: 1440px; margin: 0 auto; padding: 48px 40px 0; box-sizing: border-box">
<img src="img/8f6e9e61f641-4aace8f6.jpg" alt="Illustration of a group of players around a tabletop game of Microbial Realm, with a Dungeon Master behind a screen" style="width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block">
<p style="margin: 10px 0 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5F5A52">Tabletop play — gameplay illustration</p>
</section>

<section style="max-width: 1440px; margin: 0 auto; padding: 80px 40px; box-sizing: border-box; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr)); gap: 48px 80px">
<dl style="margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 14px 28px; align-content: start; font-size: 15px">
<dt style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5F5A52; padding-top: 3px">CREATED BY</dt><dd style="margin: 0">Madhushree Kamak (India) &amp; Kanpong Boonthaworn (Thailand)</dd>
<dt style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5F5A52; padding-top: 3px">AUDIENCE</dt><dd style="margin: 0">Teenagers, 13–18, in schools and communities</dd>
<dt style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5F5A52; padding-top: 3px">FORMAT</dt><dd style="margin: 0">Web game + facilitator-led tabletop</dd>
<dt style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5F5A52; padding-top: 3px">SINCE</dt><dd style="margin: 0">2024</dd>
</dl>
<div style="display: flex; flex-direction: column; gap: 20px">
<p style="margin: 0; font-size: clamp(21px, 2vw, 27px); line-height: 1.4; letter-spacing: -0.01em">A team of healers tracks a superbug across a continent. Along the way, players learn that how you use an antibiotic matters as much as which one you use.</p>
<p style="margin: 0; color: #3D3A35">The science is built into the rules, not told in cutscenes. Resistance grows as a visible game variable, the triage sequence is the condition for winning a fight, and traditional and community knowledge carries real tactical weight alongside medicine. The game runs in a browser or as a tabletop session, so it works in classrooms with or without screens.</p>
</div>
</section>

<section aria-labelledby="premise" style="background: #1B1A18; color: #F7F4EF">
<div style="max-width: 1100px; margin: 0 auto; padding: 112px 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 28px">
<h2 id="premise" style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 400; letter-spacing: 0.06em; color: #E9B48F">THE PREMISE</h2>
<p style="margin: 0; font-size: clamp(26px, 3.4vw, 46px); line-height: 1.22; letter-spacing: -0.02em">You grew up in the golden age of antibiotics, when every infection seemed conquerable with a simple pill. Then OMEGA-7 arrived, resistant to everything.</p>
<p style="margin: 0; max-width: 720px; color: #CFC9BF">Survivors from a city it destroyed cross the ocean to hunt it down. The locals see them as saviours with powerful medicines. The healers learn that the locals know a few things too.</p>
</div>
</section>

<section aria-labelledby="party" style="max-width: 1440px; margin: 0 auto; padding: 112px 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 40px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 12px; max-width: 720px">
<h2 id="party" style="margin: 0; font-size: clamp(32px, 4vw, 56px); line-height: 1.05; font-weight: 500; letter-spacing: -0.03em">Four healers. No faces.</h2>
<p style="margin: 0; color: #3D3A35">Each class stands for one part of antimicrobial stewardship: identify, treat, support, prevent. Players name them; nobody wins alone.</p>
</div>
<p style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5F5A52">Select a class</p>
</div>

<div role="tablist" aria-label="Character classes" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 16px">
<sc-for list="{{classes}}" as="c" hint-placeholder-count="4">
<button type="button" role="tab" class="mv-cls" aria-selected="{{c.sel}}" onClick="{{c.pick}}" style="{{c.btnStyle}}">
<span style="display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5F5A52">{{c.n}}</span>
<span aria-hidden="true" style="width: 14px; height: 14px; border-radius: 50%; background: {{c.color}}"></span>
</span>
<span style="font-size: 30px; font-weight: 500; letter-spacing: -0.02em">{{c.name}}</span>
<span style="font-size: 15px; color: #5F5A52">{{c.job}}</span>
</button>
</sc-for>
</div>

<div class="mv-panel" role="tabpanel" style="display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 40px; padding: 40px; background: #EFEAE2">
<div class="mv-span" style="grid-column: span 5; display: flex; flex-direction: column; gap: 12px">
<div style="position: relative; aspect-ratio: 1 / 1; background: {{cur.tint}}; overflow: hidden">
<img src="{{shown}}" alt="{{shownAlt}}" style="width: 100%; height: 100%; object-fit: contain; display: block">
</div>
<div role="group" aria-label="Artwork stage" style="display: flex; gap: 8px">
<button type="button" onClick="{{toFinal}}" aria-pressed="{{finalOn}}" style="{{finalStyle}}">Final</button>
<button type="button" onClick="{{toSketch}}" aria-pressed="{{sketchOn}}" style="{{sketchStyle}}">Sketch</button>
</div>
</div>
<div class="mv-span" style="grid-column: span 7; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; gap: 12px 20px">
<h3 style="margin: 0; font-size: 44px; font-weight: 500; letter-spacing: -0.03em">{{cur.name}}</h3>
<span style="font-size: 18px; color: #3D3A35">{{cur.job}}</span>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<span style="padding: 6px 14px; border-radius: 999px; background: #F7F4EF; font-family: 'IBM Plex Mono', monospace; font-size: 12px">HP {{cur.hp}}</span>
<span style="padding: 6px 14px; border-radius: 999px; background: #F7F4EF; font-family: 'IBM Plex Mono', monospace; font-size: 12px">{{cur.role}}</span>
<span style="padding: 6px 14px; border-radius: 999px; background: #1E5E5A; color: #F7F4EF; font-family: 'IBM Plex Mono', monospace; font-size: 12px">Stewardship: {{cur.stew}}</span>
</div>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
<sc-for list="{{cur.powers}}" as="p" hint-placeholder-count="2">
<li style="display: flex; flex-direction: column; gap: 6px; padding: 18px 0; border-top: 1px solid #D6CEC1">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 500; letter-spacing: 0.04em; color: #8A4721">{{p.t}}</span>
<span style="color: #3D3A35">{{p.d}}</span>
</li>
</sc-for>
</ul>
</div>
</div>
</section>

<section aria-labelledby="mech" style="background: #1E5E5A; color: #F7F4EF">
<div style="max-width: 1440px; margin: 0 auto; padding: 112px 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 56px">
<div style="display: flex; flex-direction: column; gap: 12px; max-width: 760px">
<h2 id="mech" style="margin: 0; font-size: clamp(32px, 4vw, 56px); line-height: 1.05; font-weight: 500; letter-spacing: -0.03em">The science is the rules</h2>
<p style="margin: 0; color: #D9E8E6">Every fight follows the same triage. Skip a step and the game remembers.</p>
</div>
<ol style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 24px">
<li style="display: flex; flex-direction: column; gap: 12px; padding: 28px; border: 1px solid rgba(247,244,239,0.35)">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #E9B48F">01 · IDENTIFY</span>
<span style="font-size: 22px; font-weight: 500">The Druid analyses the bacteria</span>
<span style="color: #D9E8E6; font-size: 15px">Roll 1d6. On 3–6, the species is identified and targeted antibiotics unlock.</span>
</li>
<li style="display: flex; flex-direction: column; gap: 12px; padding: 28px; border: 1px solid rgba(247,244,239,0.35)">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #E9B48F">02 · PRESCRIBE</span>
<span style="font-size: 22px; font-weight: 500">The Paladin uses the right drug</span>
<span style="color: #D9E8E6; font-size: 15px">Targeted antibiotics hit three times harder than broad-spectrum ones, which feed resistance.</span>
</li>
<li style="display: flex; flex-direction: column; gap: 12px; padding: 28px; border: 1px solid rgba(247,244,239,0.35)">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #E9B48F">03 · COMPLETE</span>
<span style="font-size: 22px; font-weight: 500">Finish the course</span>
<span style="color: #D9E8E6; font-size: 15px">Leave a population alive and the next of its family returns with +1 Resistance Point.</span>
</li>
</ol>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 24px 64px; padding-top: 24px; border-top: 1px solid rgba(247,244,239,0.35)">
<p style="margin: 0; font-size: 15px; color: #D9E8E6"><strong style="color: #F7F4EF; font-weight: 600">Resistance you can see.</strong> Every microbe carries Resistance Points that weaken the party's attacks. Misuse raises them.</p>
<p style="margin: 0; font-size: 15px; color: #D9E8E6"><strong style="color: #F7F4EF; font-weight: 600">Knowledge as co-equal.</strong> Items and allies from local, traditional practice give real tactical advantage, without replacing medicine.</p>
<p style="margin: 0; font-size: 15px; color: #D9E8E6"><strong style="color: #F7F4EF; font-weight: 600">Fighting bacteria with bacteria.</strong> Beneficial microbes and public-health measures debuff pathogens; two together make it permanent.</p>
</div>
</div>
</section>



<section aria-labelledby="bestiary" style="background: #EFEAE2">
<div style="max-width: 1440px; margin: 0 auto; padding: 112px 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 40px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px">
<h2 id="bestiary" style="margin: 0; font-size: clamp(32px, 4vw, 56px); line-height: 1.05; font-weight: 500; letter-spacing: -0.03em">The microbes</h2>
<p style="margin: 0; max-width: 420px; font-size: 15px; color: #3D3A35">Each family gets harder, and more resistant, the more it is mistreated.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 16px">
<sc-for list="{{microbes}}" as="m" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 10px; padding: 20px; background: #F7F4EF">
<img src="{{m.src}}" alt="{{m.alt}}" style="width: 100%; aspect-ratio: 1 / 1; object-fit: contain; display: block">
<span style="font-size: 24px; font-weight: 500; letter-spacing: -0.01em; font-style: italic">{{m.name}}</span>
<span style="font-size: 15px; color: #5F5A52">{{m.d}}</span>
</div>
</sc-for>
</div>
</div>
</section>

<section aria-labelledby="omega" style="background: #1B1A18; color: #F7F4EF">
<div style="max-width: 1440px; margin: 0 auto; padding: 112px 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 48px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 12px">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.06em; color: #CFC9BF">THE FINAL BOSS</span>
<h2 id="omega" style="margin: 0; font-size: clamp(56px, 8vw, 128px); line-height: 0.9; font-weight: 500; letter-spacing: -0.04em"><span style="color: #B79BD0">Ω-7</span> evolves</h2>
</div>
<p style="margin: 0; max-width: 460px; font-size: 16px; color: #CFC9BF">The superbug that destroyed the healers' city. Every incomplete course and every shortcut feeds it. Over the campaign OMEGA-7 grows from a lone bacterium into a chained, armoured colony, resistant to everything.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 20px">
<figure style="margin: 0; display: flex; flex-direction: column; gap: 14px">
<div style="aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center; background: #F3EFF6; border-radius: 4px"><img src="img/eb11e162dc81-99b526ee.png" alt="OMEGA-7, stage i" style="width: 62%; height: auto; display: block"></div>
<figcaption style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #E9B48F">Stage I</span><span style="font-size: 17px; color: #F7F4EF"></span></figcaption>
</figure>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 14px">
<div style="aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center; background: #F3EFF6; border-radius: 4px"><img src="img/735f2af74a2b-0bd96d86.png" alt="OMEGA-7, stage ii" style="width: 72%; height: auto; display: block"></div>
<figcaption style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #E9B48F">Stage II</span><span style="font-size: 17px; color: #F7F4EF"></span></figcaption>
</figure>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 14px">
<div style="aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center; background: #F3EFF6; border-radius: 4px"><img src="img/fc35cc130a77-b6b3004a.png" alt="OMEGA-7, stage iii" style="width: 82%; height: auto; display: block"></div>
<figcaption style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #E9B48F">Stage III</span><span style="font-size: 17px; color: #F7F4EF"></span></figcaption>
</figure>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 14px">
<div style="aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center; background: #F3EFF6; border-radius: 4px"><img src="img/9c0253e5ea3d-4f61663c.png" alt="OMEGA-7, stage iv" style="width: 92%; height: auto; display: block"></div>
<figcaption style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #E9B48F">Stage IV</span><span style="font-size: 17px; color: #F7F4EF"></span></figcaption>
</figure>
</div>
<dl style="margin: 0; display: flex; flex-wrap: wrap; gap: 16px 48px; padding-top: 24px; border-top: 1px solid #3D3A35; font-size: 15px">
