<main>
<section style="max-width: 1440px; margin: 0 auto; box-sizing: border-box; padding: 40px 40px 0; display: flex; flex-direction: column; gap: 24px">

<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 14px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #1E5E5A">Illustration · Type · 36 Days of Type</span></div>
<h1 style="margin: 0; font-size: clamp(48px, 8vw, 128px); line-height: 0.95; font-weight: 500; letter-spacing: -0.04em">#SciType</h1>
<p style="margin: 0; font-size: clamp(22px, 2.6vw, 34px); line-height: 1.2; letter-spacing: -0.015em; color: #3D3A35; max-width: 1100px">An A–Z of scientists. For 36 Days of Type, each letter became a portrait of a scientist, drawn into the letterform itself.</p>
</section>
<section style="max-width: 1440px; margin: 0 auto; box-sizing: border-box; padding: 56px 40px 0; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 40px 64px; align-items: center">
<span class="mv-zoom"><img class="mv-span" src="img/ebb8cf66dcb8-85564a99.jpg" alt="The full #SciType alphabet poster" style="grid-column: span 5; width: 100%; aspect-ratio: 10831 / 13352; object-fit: cover; display: block"></span>
<div class="mv-span" style="grid-column: span 7; display: flex; flex-direction: column; gap: 18px">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.06em; color: #A4582C">THE ALPHABET</span>
<p style="margin: 0; font-size: clamp(22px, 2.2vw, 30px); line-height: 1.3; letter-spacing: -0.015em">From Archimedes in his bath to Zimmer and his radiation experiments, every letter hides a story from the history of science.</p>
<p style="margin: 0; color: #3D3A35">Physicists and primatologists, anatomists and psychologists: the series mixes famous names with scientists who deserve to be better known. Each portrait borrows a detail from their work, a bathtub, a pea plant, a crystal lattice, and folds it into the shape of the letter.</p>
<p style="margin: 0; color: #3D3A35">Hover over a letter to see who it is. Click to see it large.</p>
</div>
</section>
<section style="max-width: 1440px; margin: 0 auto; box-sizing: border-box; padding: 96px 40px 120px">
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 16px">
<sc-for list="{{letters}}" as="a" hint-placeholder-count="25">
<button type="button" class="mv-az" onClick="{{a.open}}" aria-label="{{a.l}}: {{a.name}}" style="all: unset; cursor: pointer; position: relative; display: block; aspect-ratio: 1 / 1; overflow: hidden">
<img src="{{a.src}}" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block">
<span class="mv-ov" style="position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; padding: 18px; background: rgba(27,26,24,.78); color: #F7F4EF">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #E9B48F">{{a.l}}</span>
<span style="font-size: 20px; line-height: 1.15; font-weight: 500">{{a.name}}</span>
<span style="font-size: 14px; color: #D9D3C9">{{a.field}}</span>
</span>
</button>
</sc-for>
</div>

</section>
<div role="dialog" aria-modal="true" aria-label="{{cur.name}}" style="{{dlgStyle}}">
<div onClick="{{close}}" style="position: absolute; inset: 0; background: rgba(27,26,24,.6)"></div>
<div style="position: relative; width: min(980px, 100%); max-height: 100%; overflow: auto; background: #F7F4EF; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr))">
<img src="{{cur.src}}" alt="{{cur.l}} for {{cur.name}}" style="width: 100%; aspect-ratio: 1 / 1; object-fit: cover; display: block">
<div style="padding: 40px; display: flex; flex-direction: column; gap: 14px">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 64px; line-height: 1; color: #A4582C">{{cur.l}}</span>
<h2 style="margin: 0; font-size: 36px; line-height: 1.1; font-weight: 500; letter-spacing: -0.025em">{{cur.name}}</h2>
<span style="font-size: 17px; color: #3D3A35">{{cur.field}}</span>
<div style="display: flex; gap: 10px; margin-top: auto; padding-top: 24px">
<button type="button" onClick="{{prev}}" style="font: inherit; font-size: 14px; padding: 10px 18px; min-height: 44px; border-radius: 999px; border: 1px solid #CFC7BA; background: transparent; cursor: pointer">← Prev</button>
<button type="button" onClick="{{next}}" style="font: inherit; font-size: 14px; padding: 10px 18px; min-height: 44px; border-radius: 999px; border: 1px solid #CFC7BA; background: transparent; cursor: pointer">Next →</button>
<button type="button" onClick="{{close}}" style="font: inherit; font-size: 14px; padding: 10px 18px; min-height: 44px; border-radius: 999px; border: 1px solid #1B1A18; background: #1B1A18; color: #F7F4EF; cursor: pointer; margin-left: auto">Close</button>
</div>
</div>
